theme: adritian-free-hugo-theme
baseURL: https://adritian-demo.vercel.app/
title: Adritian Demo
languageCode: en
markup:
  goldmark:
    renderer:
      unsafe: yes
module:
  imports:
    - path: github.com/zetxek/adritian-free-hugo-theme
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: node_modules/bootstrap/scss
      target: assets/scss/bootstrap
    - source: node_modules/bootstrap/dist/js
      target: assets/js/bootstrap
    - source: node_modules/bootstrap/dist/js/bootstrap.bundle.min.js
      target: assets/js/vendor/bootstrap.bundle.min.js
    - source: node_modules/bootstrap-print-css/css/bootstrap-print.css
      target: assets/css/bootstrap-print.css
params:
  analytics:
    googleAnalytics:
      code: UA-XXXXX-Y
      enabled: no
    googleTagManager:
      code: GTM-XXXXX
      enabled: no
    vercelAnalytics: no
    vercelPageInsights: no
  blog:
    layout: default
    listStyle: summary
    recentPostCount: 5
    showCategories: yes
    showRecentPosts: yes
    sidebarWidth: '25'
  colorTheme:
    selector:
      disable:
        footer: no
        header: no
        mobileHeader: no
  description: This hugo theme (Adritian) is based on Bootstrap and has features that
    make it suitable for a personal site, a portfolio or other kind of Single Page
    Applications.
  experience:
    showJobCard: yes
  homepageExperienceCount: 6
  images: /img/og-img.png
  languages:
    selector:
      disable:
        footer: no
        header: no
        mobileHeader: no
  plugins:
    css:
      - URL: css/custom.css
      - URL: css/adritian-icons.css
      - URL: css/bootstrap-print.css
    js:
      - URL: js/rad-animations.js
      - URL: js/sticky-header.js
      - URL: js/library/fontfaceobserver.js
    scss:
      - URL: scss/adritian.scss
  sections:
    - showcase
    - about
    - education
    - experience
    - client-and-work
    - testimonial
    - contact
    - newsletter
  title: Adritian - a high performance hugo theme by Adrián Moreno
build:
  buildStats:
    disableClasses: no
    disableIDs: no
    disableTags: no
    enable: yes
languages:
  en:
    disabled: no
    languageCode: en
    languageDirection: ltr
    languageName: English
    menus:
      footer:
        - URL: '#about'
          name: About
          weight: 2
        - URL: '#portfolio'
          name: Portfolio
          weight: 3
        - URL: '#contact'
          name: Contact
          weight: 4
      header:
        - URL: '#about'
          name: About
          weight: 2
        - URL: '#portfolio'
          name: Portfolio
          weight: 3
        - URL: /blog
          name: How to
          weight: 5
        - URL: '#contact'
          name: Contact
          weight: 6
    title: ''
    weight: 0
  es:
    disabled: no
    languageCode: es
    languageDirection: ltr
    languageName: Español
    menus:
      footer:
        - URL: /es/#about
          name: Sobre mi
          weight: 2
        - URL: /es/#portfolio
          name: Portfolio
          weight: 3
        - URL: /es/#contact
          name: Contact
          weight: 4
      header:
        - URL: /es/#about
          name: Sobre mi
          weight: 2
        - URL: /es/#portfolio
          name: Portfolio
          weight: 3
        - URL: /es/blog
          name: Blog
          weight: 5
        - URL: /es/#contact
          name: Contacto
          weight: 6
    title: ''
    weight: 0
  fr:
    disabled: no
    languageCode: fr
    languageDirection: ltr
    languageName: Français
    menus:
      footer:
        - URL: '#about'
          name: About
          weight: 2
        - URL: '#portfolio'
          name: Portfolio
          weight: 3
        - URL: '#contact'
          name: Contact
          weight: 4
      header:
        - URL: '#about'
          name: About
          weight: 2
        - URL: '#portfolio'
          name: Portfolio
          weight: 3
        - URL: /blog
          name: Blog
          weight: 5
        - URL: '#contact'
          name: Contact
          weight: 6
    title: ''
    weight: 0
